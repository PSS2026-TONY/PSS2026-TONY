<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      background: #f4f1ec;
      color: #141414;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      mix-blend-mode: multiply;
    }
    .stack {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mark { display: block; }
    h1 {
      margin-top: 28px;
      font-family: "Instrument Serif", "Liberation Serif", serif;
      font-weight: 400;
      font-size: 92px;
      line-height: 0.9;
      letter-spacing: -0.025em;
      color: #141414;
    }
    .sub {
      margin-top: 14px;
      font-family: "Instrument Serif", "Liberation Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #6f675f;
    }
    .rule {
      margin-top: 28px;
      width: 56px;
      height: 3px;
      background: #d3121a;
    }
  </style>
</head>
<body>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.078  0 0 0 0 0.071  0 0 0 0 0.063  0 0 0 0.22 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <div class="stack">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" width="148" height="118" viewBox="0 0 148 118" aria-hidden="true">
      <circle cx="74" cy="18" r="14" fill="#d3121a"/>
      <path fill="#141414" d="M22 68 L74 36 L126 68 V114 H22 Z"/>
      <rect x="64" y="86" width="20" height="28" fill="#f4f1ec"/>
    </svg>
    <h1>Public Service</h1>
    <div class="sub">Solar Proposals</div>
    <div class="rule"></div>
  </div>
</body>
</html>
